name: Obfuscation Build

on:
  push:
    branches:
      - master  # 仅当 push 到 主分支时触发
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🛠️ Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: 🧱 Build with Gradle
        run: ./gradlew build

      - name: 🧱 obfuscate Mod
        run: ./gradlew obfuscateMod



      - name: 📦 Zip build/libs contents
        run: |
          mkdir -p artifacts
          cp build/libs/**.jar artifacts
          cp mapping.txt artifacts

      - name: 🚀 Upload zipped artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-obfuscation
          path: artifacts/**
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
          overwrite: true
